<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entornos inmersivos · Antes y después</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#203d3c;font:16px system-ui,sans-serif}header,main{max-width:1440px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 8px}p{line-height:1.6;margin:0}nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}a{color:#206c62}section{background:#fffdf6;border-radius:22px;padding:20px;margin-bottom:28px;box-shadow:0 6px 24px #173c3710}h2{margin:0 0 12px;font-size:24px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}figcaption{font-weight:750;padding:0 0 8px}img{width:100%;display:block;border-radius:12px;border:1px solid #d6dfda}.note{font-size:13px;color:#526862;margin-top:12px}body.single header{display:none}body.single main{padding:16px;max-width:none}body.single section{margin:0;padding:14px;box-shadow:none}body.single h2{font-size:22px}body.single section[hidden]{display:none}body.single .note{margin-top:8px}@media(max-width:700px){.pair{grid-template-columns:1fr}body.single .pair{grid-template-columns:1fr 1fr}header,main{padding:14px}}
</style>
<header><h1>Los tres mundos y sus guías: antes y después</h1><p>Capturas del proyecto real, a 1280 × 800, con la misma cámara general. El “antes” corresponde al estado existente al iniciar este rediseño. Las poses y los personajes ambientales pueden variar entre fotogramas.</p><nav id="links"></nav></header>
<main id="gallery"></main>
<script>
const entries=[['aula','Aula','Mobiliario moldeado, marcos continuos, paneles acústicos y acabados cálidos.'],['estacion','Estación espacial','Portales estructurales, consola perfilada, paneles técnicos y nuevos materiales de planetas.'],['museo','Museo','Arcos de galería, pedestales perfilados, herrajes y escultura de cinta.'],['luma','Luma · guía del aula','Modelo GLB original: carcasa, visor, manos articuladas y accesorios escolares.'],['nova','Nova · guía espacial','Modelo GLB original: casco modular, antenas y piezas turquesa y naranja.'],['mica','Mica · guía del museo','Modelo GLB original: sombrero de exploración, correa y bolso.']];
const selected=new URLSearchParams(location.search).get('item');if(selected)document.body.classList.add('single');
for(const [id,title,note] of entries){const section=document.createElement('section');section.id=id;section.hidden=!!selected&&selected!==id;section.innerHTML=`<h2>${title}</h2><div class="pair"><figure><figcaption>ANTES</figcaption><img src="${id}-antes.jpg" alt="${title} antes del rediseño"></figure><figure><figcaption>DESPUÉS</figcaption><img src="${id}-despues.jpg" alt="${title} después del rediseño"></figure></div><p class="note">${note}</p>`;document.querySelector('#gallery').append(section);const link=document.createElement('a');link.href='#'+id;link.textContent=title;document.querySelector('#links').append(link);}
</script>
</html>
